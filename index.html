        /* Плавное появление всего тела сайта */
        body {

            overflow-x: hidden;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        body.loaded {
            opacity: 1;
        }

        .glow-sphere { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; z-index: 0; pointer-events: none; }
        
        /* Улучшенный Scroll Reveal */
        .reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1); 
            will-change: transform, opacity;
        }
        .reveal.active { 
            opacity: 1; 
            transform: translateY(0);

        .glass-card { background: rgba(18, 12, 36, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(157, 78, 221, 0.1); }
        .yandex-svg { width: 40px; height: 40px; fill: currentColor; }

        .delay-2 { transition-delay: 0.4s; }

    </style>

    <script>
        // 1. Появление всего сайта после загрузки
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });

        // 2. Анимация названия вкладки
        const titleText = "PSIXOmaniya";
        let currentIndex = 0;
        let isDeleting = false;
        let typingSpeed = 200;

        function animateTitle() {
            if (!isDeleting) {
                document.title = titleText.substring(0, currentIndex + 1);
                currentIndex++;
                typingSpeed = 200;
                if (currentIndex === titleText.length) {
                    isDeleting = true;
                    typingSpeed = 2000;
                }
            } else {
                document.title = titleText.substring(0, currentIndex - 1) || "P";
                currentIndex--;
                typingSpeed = 60;
                if (currentIndex <= 1) {
                    isDeleting = false;
                    typingSpeed = 500;
                }
            }
            setTimeout(animateTitle, typingSpeed);
        }
        animateTitle();

        // 3. Улучшенный Scroll Reveal (Intersection Observer)
        const revealOptions = {
            threshold: 0.15,
            rootMargin: "0px 0px -50px 0px"
        };

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    // Если нужно анимировать только один раз, раскомментируйте:
                    // revealObserver.unobserve(entry.target);
                }
            });
        }, revealOptions);

        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // 4. Mobile Menu
        const btn = document.getElementById('mobile-menu-btn');
        btn.addEventListener('click', () => {
            const nav = document.querySelector('nav');
            nav.classList.toggle('hidden');
            nav.classList.toggle('flex');
            nav.classList.toggle('flex-col');
            nav.classList.toggle('absolute');
            nav.classList.toggle('top-16');
            nav.classList.toggle('left-0');
            nav.classList.toggle('w-full');
            nav.classList.toggle('bg-darkBg');
            nav.classList.toggle('p-6');
            nav.classList.toggle('z-50');
        });
    </script>
