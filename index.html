    <style>
        body { 
            background-color: #06020f; 
            color: #f3f4f6; 
            overflow-x: hidden;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.loaded { opacity: 1; }

        .glow-sphere { 
            position: fixed; 
            border-radius: 50%; 
            filter: blur(140px); 
            opacity: 0.2; 
            z-index: 0; 
            pointer-events: none; 
            animation: floatSphere 20s ease-in-out infinite;
        }
        .glow-sphere:nth-child(2) { animation-delay: -10s; animation-duration: 25s; }

        @keyframes floatSphere {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .reveal { 
            opacity: 0; 
            transform: translateY(50px); 
            transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1), transform 1s cubic-bezier(0.22, 1, 0.36, 1); 
            will-change: transform, opacity;
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .glass-card { 
            background: rgba(13, 9, 24, 0.55); 
            backdrop-filter: blur(20px) saturate(1.2); 
            border: 1px solid rgba(178, 75, 243, 0.08);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px);
        }

        .yandex-svg { width: 40px; height: 40px; fill: currentColor; }

        .delay-1 { transition-delay: 0.15s; }
        .delay-2 { transition-delay: 0.35s; }
        .delay-3 { transition-delay: 0.55s; }

        .hero-img-wrapper {
            position: relative;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .hero-img-wrapper:hover {
            transform: perspective(1000px) rotateY(-3deg) rotateX(2deg) scale(1.02);
        }
        .hero-img-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(178,75,243,0.4), rgba(255,45,149,0.2), rgba(124,58,237,0.3));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.6s ease;
            filter: blur(8px);
        }
        .hero-img-wrapper:hover::before { opacity: 1; }

        .hero-img-border {
            position: relative;
            border-radius: 1rem;
            padding: 2px;
            background: linear-gradient(135deg, rgba(178,75,243,0.3), rgba(124,58,237,0.15), rgba(178,75,243,0.3));
            background-size: 200% 200%;
            animation: borderFlow 4s ease infinite;
        }
        .hero-img-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(178,75,243,0.5), rgba(255,45,149,0.3), rgba(124,58,237,0.5), rgba(178,75,243,0.5));
            background-size: 300% 300%;
            animation: borderRotate 6s linear infinite;
            z-index: -1;
            filter: blur(6px);
            opacity: 0.6;
        }
        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-primary {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #b24bf3, #ff2d95);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }
        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:hover {
            color: white;
            border-color: transparent;
            box-shadow: 0 0 30px rgba(178, 75, 243, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-secondary:hover {
            border-color: rgba(178, 75, 243, 0.5);
            box-shadow: 0 0 20px rgba(178, 75, 243, 0.1);
            transform: translateY(-2px);
        }

        .platform-card {
            position: relative;
            overflow: hidden;
        }
        .platform-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(178,75,243,0.15), transparent 60%);

            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .social-link {
            position: relative;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

            content: '';

            bottom: -8px;
            left: 50%;
            width: 0;
            height: 2px;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translateX(-50%);
        }
        .social-link:hover::after { width: 100%; }
        .social-link:hover {
            transform: translateY(-4px);

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;

            left: 0;

        .nav-link {

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });

        const titleText = "PSIXOmaniya";
        let currentIndex = 0;
        let isDeleting = false;
        let typingSpeed = 200;

        function animateTitle() {
            if (!isDeleting) {
                document.title = titleText.substring(0, currentIndex + 1);
                currentIndex++;
                typingSpeed = 200;
                if (currentIndex === titleText.length) {
                    isDeleting = true;
                    typingSpeed = 2000;
                }
            } else {
                document.title = titleText.substring(0, currentIndex - 1) || "P";
                currentIndex--;
                typingSpeed = 60;
                if (currentIndex <= 1) {
                    isDeleting = false;
                    typingSpeed = 500;
                }
            }
            setTimeout(animateTitle, typingSpeed);
        }
        animateTitle();

        const revealOptions = {
            threshold: 0.12,
            rootMargin: "0px 0px -60px 0px"
        };

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, revealOptions);

        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        const staggerObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 100);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.stagger-item').forEach(el => staggerObserver.observe(el));

        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        const menuIcon = document.getElementById('menu-icon');
        let menuOpen = false;

        btn.addEventListener('click', () => {
            menuOpen = !menuOpen;
            if (menuOpen) {
                menu.classList.add('open');
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');
                document.body.style.overflow = 'hidden';
            } else {
                menu.classList.remove('open');
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
                document.body.style.overflow = '';
            }
        });

        document.querySelectorAll('.mobile-nav-link').forEach(link => {
            link.addEventListener('click', () => {
                menuOpen = false;
                menu.classList.remove('open');
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
                document.body.style.overflow = '';
            });
        });

        document.querySelectorAll('.platform-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                card.style.setProperty('--mouse-x', x + '%');
                card.style.setProperty('--mouse-y', y + '%');
            });
        });

        const header = document.getElementById('header');
        let lastScroll = 0;

        window.addEventListener('scroll', () => {
            const currentScroll = window.scrollY;
            const progress = (currentScroll / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            document.getElementById('scrollProgress').style.width = progress + '%';

            if (currentScroll > 100) {
                header.classList.add('py-3');
                header.classList.remove('py-4');
                header.style.background = 'rgba(6, 2, 15, 0.8)';
            } else {
                header.classList.add('py-4');
                header.classList.remove('py-3');
                header.style.background = '';
            }
            lastScroll = currentScroll;
        });
    </script>
</body>
</html>
