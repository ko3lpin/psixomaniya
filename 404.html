<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090514',
                        neonPurple: '#9d4edd',
                        neonViolet: '#7b2cbf',
                        neonPink: '#ff007f',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    },
                    boxShadow: {
                        'neon-glow': '0 0 15px rgba(157, 78, 221, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #090514; 
            color: #f3f4f6; 
            overflow-x: hidden;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        body.loaded {
            opacity: 1;
        }

        .glow-sphere { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; z-index: 0; pointer-events: none; }
        
        .reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1); 
            will-change: transform, opacity;
        }
        .reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }

        .glass-card { background: rgba(18, 12, 36, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(157, 78, 221, 0.1); }

        .delay-1 { transition-delay: 0.2s; }
        .delay-2 { transition-delay: 0.4s; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-neonPurple min-h-screen flex flex-col justify-between">

    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] glow-sphere bg-neonPurple"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] glow-sphere bg-neonViolet"></div>

    <header class="fixed top-0 left-0 w-full z-50 glass-card border-b border-white/5 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="font-syne text-xl md:text-2xl font-extrabold tracking-widest text-neonPurple hover:brightness-125 transition-all">
                PSIXOmaniya
            </a>
            
            <nav class="hidden md:flex items-center space-x-8 text-xs font-bold uppercase tracking-widest">
                <a href="/#music" class="hover:text-neonPurple transition-colors">Music</a>
                <a href="/#socials" class="hover:text-neonPurple transition-colors">Social</a>
                <a href="/#contact" class="hover:text-neonPurple transition-colors">Contact</a>
            </nav>

            <button id="mobile-menu-btn" class="md:hidden text-white"><i class="fa-solid fa-bars text-xl"></i></button>
        </div>
    </header>

    <main class="relative flex-grow flex items-center justify-center pt-24 px-6">
        <div class="max-w-2xl mx-auto text-center reveal delay-1">
            <h1 class="font-syne text-7xl sm:text-8xl lg:text-9xl font-black tracking-tighter text-white mb-2">
                4<span class="text-transparent bg-clip-text bg-gradient-to-r from-neonPurple to-neonPink">0</span>4
            </h1>
            <p class="font-syne text-xl md:text-2xl font-bold uppercase tracking-wider text-gray-300 mb-8">
                Page Not Found
            </p>
            <div class="reveal delay-2">
                <a href="/" class="inline-block px-8 py-4 bg-white text-black font-bold rounded-full hover:bg-neonPurple hover:text-white transition-all duration-300 uppercase text-sm tracking-widest">
                    Go Home
                </a>
            </div>
        </div>
    </main>

    <footer class="py-12 border-t border-white/5 text-center text-gray-600 text-[10px] uppercase tracking-widest relative z-10">
        &copy; 2026 PSIXOmaniya. All Rights Reserved.
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });

        const revealOptions = {
            threshold: 0.15,
            rootMargin: "0px 0px -50px 0px"
        };

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, revealOptions);

        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        const btn = document.getElementById('mobile-menu-btn');
        btn.addEventListener('click', () => {
            const nav = document.querySelector('nav');
            nav.classList.toggle('hidden');
            nav.classList.toggle('flex');
            nav.classList.toggle('flex-col');
            nav.classList.toggle('absolute');
            nav.classList.toggle('top-16');
            nav.classList.toggle('left-0');
            nav.classList.toggle('w-full');
            nav.classList.toggle('bg-darkBg');
            nav.classList.toggle('p-6');
            nav.classList.toggle('z-50');
        });
    </script>
</body>
</html>
