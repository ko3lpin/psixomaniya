<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#06020f',
                        neonPurple: '#b24bf3',
                        neonViolet: '#7c3aed',
                        neonPink: '#ff2d95',
                        surface: '#0d0918',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    },
                    boxShadow: {
                        'neon-glow': '0 0 30px rgba(178, 75, 243, 0.25), 0 0 60px rgba(178, 75, 243, 0.1)',
                        'neon-glow-strong': '0 0 40px rgba(178, 75, 243, 0.4), 0 0 80px rgba(178, 75, 243, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #06020f; 
            color: #f3f4f6; 
            overflow: hidden;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.loaded { opacity: 1; }

        .glow-sphere { 
            position: fixed; 
            border-radius: 50%; 
            filter: blur(140px); 
            opacity: 0.2; 
            z-index: 0; 
            pointer-events: none; 
            animation: floatSphere 20s ease-in-out infinite;
        }
        .glow-sphere:nth-child(2) { animation-delay: -10s; animation-duration: 25s; }

        @keyframes floatSphere {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .glass-card { 
            background: rgba(13, 9, 24, 0.55); 
            backdrop-filter: blur(20px) saturate(1.2); 
            border: 1px solid rgba(178, 75, 243, 0.08);
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        .btn-home {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-home::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #b24bf3, #ff2d95);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }
        .btn-home:hover::before { opacity: 1; }
        .btn-home:hover {
            color: white;
            border-color: transparent;
            box-shadow: 0 0 30px rgba(178, 75, 243, 0.3);
            transform: translateY(-2px);
        }

        .reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1), transform 1s cubic-bezier(0.22, 1, 0.36, 1); 
        }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.2s; }
        .delay-2 { transition-delay: 0.5s; }
        .delay-3 { transition-delay: 0.8s; }

        .digits {
            color: #b24bf3;
            text-shadow: 0 0 40px rgba(178, 75, 243, 0.4), 0 0 80px rgba(178, 75, 243, 0.15);
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { 
                text-shadow: 0 0 40px rgba(178, 75, 243, 0.3), 0 0 80px rgba(178, 75, 243, 0.1);
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 60px rgba(178, 75, 243, 0.5), 0 0 120px rgba(178, 75, 243, 0.2);
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-neonPurple selection:text-white">

    <div class="noise-overlay"></div>

    <div class="fixed top-[-15%] left-[-15%] w-[60vw] h-[60vw] glow-sphere bg-neonPurple"></div>
    <div class="fixed bottom-[-15%] right-[-15%] w-[60vw] h-[60vw] glow-sphere bg-neonViolet"></div>

    <header class="fixed top-0 left-0 w-full z-50 glass-card border-b border-white/5 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="font-syne text-xl md:text-2xl font-extrabold tracking-widest text-neonPurple hover:brightness-125 transition-all duration-300">
                PSIXOmaniya
            </a>
        </div>
    </header>

    <main class="relative min-h-screen flex items-center justify-center px-6">
        <div class="max-w-2xl mx-auto text-center">
            <div class="reveal delay-1 mb-6">
                <h1 class="font-syne text-[120px] sm:text-[160px] md:text-[200px] font-black leading-none tracking-tighter digits">
                    404
                </h1>
            </div>

            <div class="reveal delay-2 mb-4">
                <p class="font-syne text-2xl md:text-3xl font-bold uppercase tracking-tighter text-white/90">
                    Page not found
                </p>
            </div>

            <div class="reveal delay-3 mt-10">
                <a href="/" class="btn-home inline-flex items-center gap-3 px-8 py-4 bg-white text-black font-bold rounded-full uppercase text-sm tracking-widest">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full py-6 text-center text-gray-600 text-[10px] uppercase tracking-widest">
        &copy; 2026 PSIXOmaniya. All Rights Reserved.
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);

            document.querySelectorAll('.reveal').forEach((el, i) => {
                setTimeout(() => {
                    el.classList.add('active');
                }, 200 + i * 250);
            });
        });
    </script>
</body>
</html>
