<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    darkBg: '#040406',
                    darkCard: '#0a0a0f',
                    crtRed: '#e61c38',
                    crtWhite: '#d1e2e6',
                },
                fontFamily: {
                    sans: ['Montserrat', 'sans-serif'],
                    mono: ['"Share Tech Mono"', 'monospace'],
                    syne: ['Syne', 'sans-serif'],
                },
            }

    }

<style>
    body { 
        background-color: #040406; 
        color: #d1d5db; 
        overflow-x: hidden;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
    }
    body.loaded { opacity: 1; }

    .crt-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 50;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
        background-size: 100% 4px;
        opacity: 0.6;
    }

    .crt-vignette {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 45;
        background: radial-gradient(circle, transparent 45%, rgba(0, 0, 0, 0.95) 100%);
    }

    .ambient-glow {
        position: absolute; 
        top: 30%; 
        left: 50%; 
        transform: translate(-50%, -50%);
        width: 60vw; 
        height: 60vw; 
        max-width: 500px;
        background: #8a0f21; 
        border-radius: 50%; 
        filter: blur(140px); 
        opacity: 0.22; 
        z-index: 0; 
        pointer-events: none;
        transition: opacity 0.8s ease, filter 0.8s ease, transform 0.8s ease;
    }

    .ambient-glow.flash {
        opacity: 0.65;
        filter: blur(90px);
        transform: translate(-50%, -50%) scale(1.3);
    }

    @keyframes heartPulse {
        0%, 100% {
            opacity: 0.18;
            transform: scale(1) translateY(0);
            filter: drop-shadow(0 0 2px rgba(230, 28, 56, 0.2));
        }
        50% {
            opacity: 0.65;
            transform: scale(1.08) translateY(-6px);
            filter: drop-shadow(0 0 12px rgba(230, 28, 56, 0.7));
        }
    }

    .pixel-heart {
        position: absolute;
        color: #e61c38;
        pointer-events: none;
        z-index: 1;
        animation: heartPulse 4.5s ease-in-out infinite;
    }

    .platform-card {
        background: rgba(10, 10, 15, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        transition: all 0.3s ease;
    }
    .platform-card:hover {
        background: rgba(25, 12, 18, 0.92);
        border-color: rgba(230, 28, 56, 0.55);
        box-shadow: 0 0 22px rgba(230, 28, 56, 0.2);
        transform: translateY(-2px);
    }

    .crt-text-shadow {
        text-shadow: 0 0 8px rgba(208, 224, 230, 0.3), -1px 0 2px rgba(230, 28, 56, 0.4);
    }

    .cover-art {
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(230, 28, 56, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .cover-art:hover {
        transform: scale(1.015);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.95), 0 0 35px rgba(230, 28, 56, 0.35);
    }

    .yandex-svg { width: 20px; height: 20px; fill: currentColor; }

    .reveal { 
        opacity: 0; 
        transform: translateY(25px) scale(0.96); 
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    .reveal.active { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
    }

    #intro-screen {
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        transform: scale(1);
        filter: blur(0px);
    }

    #intro-screen.out {
        opacity: 0;
        transform: scale(1.35);
        filter: blur(20px);
        pointer-events: none;
    }

    .main-container {
        transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), filter 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
        transform: scale(0.88);
        filter: blur(12px);
        opacity: 0;
    }

    .main-container.active {
        transform: scale(1);
        filter: blur(0px);
        opacity: 1;
    }

    .neon-purple-btn {
        background: rgba(10, 10, 15, 0.85);
        border: 3px solid #b026ff;
        color: #ffffff;
        box-shadow: 0 0 20px rgba(176, 38, 255, 0.4), inset 0 0 20px rgba(176, 38, 255, 0.25);
        text-shadow: 0 0 10px rgba(176, 38, 255, 0.8);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .neon-purple-btn:hover {
        border-color: #d880ff;
        box-shadow: 0 0 35px rgba(176, 38, 255, 0.9), inset 0 0 25px rgba(176, 38, 255, 0.6);
        transform: scale(1.06);
        color: #ffffff;
    }

    .neon-purple-btn.followed {
        border-color: #e61c38 !important;
        box-shadow: 0 0 50px rgba(230, 28, 56, 1), inset 0 0 30px rgba(230, 28, 56, 0.7) !important;
        color: #ff4d6d !important;
        text-shadow: 0 0 15px rgba(230, 28, 56, 1) !important;
        transform: scale(1.08);
    }

    @keyframes burstParticle {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        100% { opacity: 0; transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0); }
    }
    .burst-heart {
        position: absolute;
        pointer-events: none;
        animation: burstParticle 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    .flash-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgba(230, 28, 56, 0.35) 0%, rgba(0,0,0,0) 70%);
        pointer-events: none;
        opacity: 0;
        z-index: 35;
        transition: opacity 0.5s ease;
    }
    .flash-overlay.active {
        opacity: 1;
    }
</style>
</head>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('loaded');
    });

    const followBtn = document.getElementById('follow-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const introScreen = document.getElementById('intro-screen');
    const mainContainer = document.getElementById('main-container');
    const ambientGlow = document.getElementById('ambient-glow');
    const flashOverlay = document.getElementById('flash-overlay');

    followBtn.addEventListener('click', () => {
        followBtn.disabled = true;

        followBtn.classList.add('followed');
        btnIcon.className = "fa-solid fa-check text-lg sm:text-xl transition-all duration-300 scale-125";
        btnText.textContent = "FOLLOWED";

        createParticleBurst(followBtn);

        setTimeout(() => {
            ambientGlow.classList.add('flash');
            flashOverlay.classList.add('active');
        }, 300);

        setTimeout(() => {
            introScreen.classList.add('out');
            mainContainer.classList.add('active');

            setTimeout(() => {
                flashOverlay.classList.remove('active');
                ambientGlow.classList.remove('flash');
            }, 400);

            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach((el, index) => {
                    setTimeout(() => {
                        el.classList.add('active');
                    }, index * 90);
                });
            }, 200);

            setTimeout(() => {
                introScreen.style.display = 'none';
            }, 900);
        }, 750);
    });

    function createParticleBurst(element) {
        const rect = element.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        for (let i = 0; i < 18; i++) {
            const heart = document.createElement('i');
            heart.className = 'fa-solid fa-heart burst-heart text-base text-crtRed';
            
            const angle = (i / 18) * Math.PI * 2;
            const distance = 80 + Math.random() * 70;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            heart.style.left = `${centerX}px`;
            heart.style.top = `${centerY}px`;
            heart.style.setProperty('--tw-translate-x', `${tx}px`);
            heart.style.setProperty('--tw-translate-y', `${ty}px`);

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 900);
        }
    }

    const titleText = "Follow You...";
    let titleIndex = 1;
    let isDeleting = false;
    let typingSpeed = 200;

    function animateTitle() {
        document.title = titleText.substring(0, titleIndex);

        if (!isDeleting) {
            titleIndex++;
            typingSpeed = 200;
            if (titleIndex > titleText.length) {
                isDeleting = true;
                typingSpeed = 2000;
            }
        } else {
            titleIndex--;
            typingSpeed = 90;
            if (titleIndex === 1) {
                isDeleting = false;
                typingSpeed = 600;
            }
        }
        setTimeout(animateTitle, typingSpeed);
    }
    animateTitle();
</script>
</body>
</html>
